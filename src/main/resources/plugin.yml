name: Countries
version: '${version}'
main: com.ucucraft.countries.CountriesPlugin
api-version: '26.2'
author: ucucraft
description: Create and manage countries.
softdepend: [PlaceholderAPI, dynmap, Titles]
commands:
  country:
    description: Manage countries.
    aliases: [c]
    usage: /country <create|invite|accept|leave|disband|rename|info|list|era|path|claim|unclaim|vault|ally|war|peace>
  accept:
    description: Accept a pending country invite.
    usage: /accept <player>
  path:
    description: Choose and inspect your country's path.
    aliases: [cpath]
    usage: /path [list|info <path>|choose <path>|use <ability>]
  countryadmin:
    description: Administrate country eras and criteria.
    aliases: [ca]
    usage: /countryadmin <complete|revoke|setera|setpath|reload> ...
permissions:
  countries.use:
    description: Access to base country commands.
    default: true
  countries.admin:
    description: Full administrative access.
    default: op
    children:
      countries.admin.criteria: true
      countries.admin.setera: true
      countries.admin.setpath: true
      countries.admin.reload: true
      countries.admin.bypassclaim: true
  countries.admin.criteria:
    description: Complete or revoke admin era criteria.
    default: op
  countries.admin.setera:
    description: Set a country's era directly.
    default: op
  countries.admin.setpath:
    description: Set a country's path directly.
    default: op
  countries.admin.reload:
    description: Reload era and language files.
    default: op
  countries.admin.bypassclaim:
    description: Bypass land claim protection.
    default: op
