prefix: "<gray>[<aqua>Countries</aqua>]</gray> "

player-only: "<red>Only players can use this command."
no-permission: "<red>You don't have permission to do that."
unknown-subcommand: "<red>Unknown subcommand. Use <yellow>/country</yellow> for help."

usage-create: "<yellow>Usage: /country create <name>"
usage-invite: "<yellow>Usage: /country invite <player>"
usage-accept: "<yellow>Usage: /accept <player>"
usage-rename: "<yellow>Usage: /country rename <name>"
usage-list: "<yellow>Usage: /country list [page]"
usage-ally: "<yellow>Usage: /country ally <invite|accept|disband|list> [country]"
usage-war: "<yellow>Usage: /country war <country>"
usage-peace: "<yellow>Usage: /country peace <country>"

help-header: "<gray>--- <aqua>Countries</aqua> ---"
help-create: "<yellow>/country create <name></yellow> <gray>- Found a country."
help-invite: "<yellow>/country invite <player></yellow> <gray>- Invite a player."
help-accept: "<yellow>/accept <player></yellow> <gray>- Accept an invite."
help-leave: "<yellow>/country leave</yellow> <gray>- Leave your country."
help-disband: "<yellow>/country disband</yellow> <gray>- Disband your country."
help-rename: "<yellow>/country rename <name></yellow> <gray>- Rename your country."
help-info: "<yellow>/country info [name]</yellow> <gray>- Show country info."
help-list: "<yellow>/country list [page]</yellow> <gray>- List countries."
help-era: "<yellow>/country era</yellow> <gray>- Show era progress."
help-vault: "<yellow>/country vault</yellow> <gray>- Open the country vault."
help-ally: "<yellow>/country ally <...></yellow> <gray>- Manage alliances."
help-war: "<yellow>/country war <country></yellow> <gray>- Declare war."
help-peace: "<yellow>/country peace <country></yellow> <gray>- Offer/accept peace."

name-too-short: "<red>The name must be at least {min} characters."
name-too-long: "<red>The name can be at most {max} characters."
name-invalid: "<red>That name contains invalid characters."
name-taken: "<red>A country named <yellow>{country}</yellow> already exists."

already-in-country: "<red>You are already in a country."
not-in-country: "<red>You are not in a country."
created: "<green>Country <yellow>{country}</yellow> has been created."
renamed: "<green>Your country has been renamed to <yellow>{country}</yellow>."
disbanded: "<green>Country <yellow>{country}</yellow> has been disbanded."
left: "<green>You have left <yellow>{country}</yellow>."
leader-cant-leave: "<red>Leaders can't leave. Use <yellow>/country disband</yellow> instead."
not-leader: "<red>Only the country leader can do that."

target-offline: "<red>That player is not online."
target-self: "<red>You can't invite yourself."
target-has-country: "<red>That player is already in a country."
invite-sent: "<green>You invited <yellow>{player}</yellow> to <yellow>{country}</yellow>."
invite-already-sent: "<red>You already have a pending invite to that player."
invite-received: "<green><yellow>{player}</yellow> invited you to <yellow>{country}</yellow>. Type <yellow>/accept {player}</yellow> within {seconds}s."
invite-none: "<red>You have no pending invite from <yellow>{player}</yellow>."
invite-expired: "<red>That invite has expired."
joined: "<green>You joined <yellow>{country}</yellow>."
member-joined: "<green><yellow>{player}</yellow> joined the country."

country-not-found: "<red>No country named <yellow>{country}</yellow> exists."
none: "None"
info-header: "<gray>--- <aqua>{country}</aqua> ---"
info-leader: "<gray>Leader: <white>{leader}"
info-era: "<gray>Era: <white>{era}"
info-members: "<gray>Members: <white>{members}"
info-allies: "<gray>Allies: <white>{allies}"
info-wars: "<gray>At war with: <red>{wars}"

# --- Global announcements ---
announce-created: "<green>Country <yellow>{country}</yellow> was founded by <yellow>{player}</yellow>!"
announce-disbanded: "<gold>Country <yellow>{country}</yellow> was disbanded by <yellow>{player}</yellow>."
announce-renamed: "<green>Country <yellow>{old}</yellow> was renamed to <yellow>{country}</yellow>."
announce-alliance: "<green><yellow>{a}</yellow> and <yellow>{b}</yellow> have formed an alliance!"
announce-alliance-ended: "<gold>The alliance between <yellow>{a}</yellow> and <yellow>{b}</yellow> has ended."
announce-war: "<red><yellow>{a}</yellow> has declared war on <yellow>{b}</yellow>!"
announce-peace: "<green><yellow>{a}</yellow> and <yellow>{b}</yellow> are now at peace."

# --- Diplomacy ---
diplo-self: "<red>You can't do that to your own country."
ally-already: "<red>You are already allied with <yellow>{country}</yellow>."
ally-at-war: "<red>You are at war with <yellow>{country}</yellow>. Make peace first."
ally-invite-already: "<red>You already have a pending alliance invite to <yellow>{country}</yellow>."
ally-invite-sent: "<green>You invited <yellow>{country}</yellow> to an alliance. It expires in {seconds}s."
ally-invite-received: "<green><yellow>{country}</yellow> invited your country to an alliance. Type <yellow>/country ally accept {country}</yellow>."
ally-invite-none: "<red>You have no pending alliance invite from <yellow>{country}</yellow>."
ally-formed: "<green>You are now allied with <yellow>{country}</yellow>."
ally-not-allied: "<red>You are not allied with <yellow>{country}</yellow>."
ally-ended: "<gold>Your alliance with <yellow>{country}</yellow> has ended."
ally-list: "<gray>Allies: <white>{allies}"

war-already: "<red>You are already at war with <yellow>{country}</yellow>."
war-declared: "<red>You declared war on <yellow>{country}</yellow>."

peace-not-at-war: "<red>You are not at war with <yellow>{country}</yellow>."
peace-already: "<red>You already offered peace to <yellow>{country}</yellow>."
peace-offered: "<green>You offered peace to <yellow>{country}</yellow>. It expires in {seconds}s."
peace-received: "<green><yellow>{country}</yellow> offered peace. Type <yellow>/country peace {country}</yellow> to accept."
peace-made: "<green>You are now at peace with <yellow>{country}</yellow>."

list-header: "<gray>--- <aqua>Countries</aqua> (page {page}/{pages}) ---"
list-entry: "<gray>- <yellow>{country}</yellow> <gray>({members} members)"
list-footer: "<gray>Use <yellow>/country list <page></yellow> to see more."
list-empty: "<gray>There are no countries yet."
list-bad-page: "<red>There is no page {page}."
